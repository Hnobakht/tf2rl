[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tf2rl"
version = "1.2.0"
description = "EQN-AIRL and EQN-GAIL research algorithms with native absorbing-state support"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "tensorflow>=2.18.1,<2.19",
  "tensorflow-probability>=0.25,<0.26",
  "tf-keras>=2.18,<2.19",
  "tensorboard>=2.18,<2.19",
  # TensorBoard 2.18 still imports pkg_resources (removed in setuptools 82).
  "setuptools>=77,<82",
  "gymnasium>=1.2,<1.4",
  "numpy>=1.26,<2.1",
  "cpprb>=11,<12",
  "scipy>=1.11,<2",
  "joblib>=1.3,<2",
  "hydra-core>=1.3,<1.4",
]

[project.optional-dependencies]
mujoco = ["gymnasium[mujoco]>=1.2,<1.4"]
mjwarp = ["gymnasium[mujoco]>=1.2,<1.4", "mujoco-warp>=3.16,<3.17"]
render = ["gymnasium[classic-control]>=1.2,<1.4", "matplotlib>=3.8", "pillow>=10", "opencv-python-headless>=4.8"]
dev = ["build>=1.2", "ruff>=0.11"]

[project.scripts]
tf2rl-train = "tf2rl.experiments.hydra:main"
eqn-train = "tf2rl.experiments.train:imitation_main"
ppo-train = "tf2rl.experiments.train:ppo_main"
onpolicy-train = "tf2rl.experiments.train:on_policy_main"
offpolicy-train = "tf2rl.experiments.train:off_policy_main"

[tool.setuptools.packages.find]
include = ["tf2rl*"]

[tool.setuptools.package-data]
"tf2rl.envs" = ["assets/*.xml", "assets/LICENSE.md"]
"tf2rl.experiments.conf" = ["*.yaml", "experiment/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"
