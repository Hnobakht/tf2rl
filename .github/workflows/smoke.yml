name: Training smoke workflow
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[render,mujoco,dev]'
      - name: SAC demonstrations, GAIL and EQN-GAIL
        env:
          CUDA_VISIBLE_DEVICES: '-1'
          TF_NUM_INTRAOP_THREADS: '2'
          TF_NUM_INTEROP_THREADS: '2'
        run: python scripts/run_validation_pipeline.py --steps 300 --warmup 32 --interval 300 --units 32,32 --output results/ci-smoke
      - run: eqn-train --help
      - run: python -m build
