name: Research validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[test,mujoco,dev]'
      - name: Research algorithms, environments, and utilities
        env:
          CUDA_VISIBLE_DEVICES: '-1'
          TF_NUM_INTRAOP_THREADS: '2'
          TF_NUM_INTEROP_THREADS: '2'
        run: python -m pytest tests/research tests/misc tests/envs/test_utils.py --basetemp=.tmp/pytest -q
      - run: eqn-train --help
      - run: python -m build
